name: News Poster — Daily

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST (UTC + 5:30)
  workflow_dispatch:        # manual run for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r news-instagram/requirements.txt

      - name: Run news poster
        working-directory: ./news-instagram
        run: python main.py
