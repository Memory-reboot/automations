name: Daily News Poster

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Notice the path points to your folder
      - name: Install dependencies
        run: pip install -r news-instagram/requirements.txt

      # We add working-directory so python runs inside the folder
      - name: Run AI Poster
        working-directory: ./news-instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      # We tell it to grab the image from inside the folder
      - name: Upload Generated Image
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-card
          path: news-instagram/post.jpg
